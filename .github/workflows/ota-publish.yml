name: OTA Publish

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "stores/**"
      - "services/**"
      - "utils/**"
      - "constants/**"
      - "types/**"
      - "assets/**"
      - "babel.config.js"
      - "tsconfig.json"
      - "index.ts"
  workflow_dispatch:

concurrency:
  group: ota-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync app version from package.json
        run: |
          VERSION=$(jq -r '.version' package.json)
          VERSION_CODE=$((10#$(echo "$VERSION" | tr -d '.')))
          jq --arg v "$VERSION" --argjson vc "$VERSION_CODE" \
            '.expo.version=$v | .expo.android.versionCode=$vc' \
            app.json > /tmp/app.json && mv /tmp/app.json app.json
          echo "app.json version=${VERSION} versionCode=${VERSION_CODE}"
      - name: Skip if a native release is in flight
        id: skip
        run: |
          PREV=$(git show HEAD~1:package.json 2>/dev/null | jq -r '.version // empty' 2>/dev/null || echo "")
          CUR=$(jq -r '.version' package.json)
          if [[ -n "$PREV" && "$PREV" != "$CUR" ]]; then
            echo "App version bumped ${PREV} → ${CUR}: native release in flight, skipping OTA."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write .env from secrets
        if: steps.skip.outputs.skip != 'true'
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\nEXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=%s\n' \
            "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" \
            "${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" \
            > .env
      - name: Compute runtime fingerprint
        id: fingerprint
        if: steps.skip.outputs.skip != 'true'
        run: |
          FINGERPRINT=$(node_modules/.bin/fingerprint fingerprint:generate --platform android | jq -r .hash)
          echo "fingerprint=${FINGERPRINT}" >> "$GITHUB_OUTPUT"
      - name: Guard — fingerprint must match the last released binary
        if: steps.skip.outputs.skip != 'true'
        run: |
          BODY=$(curl -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r .body)
          LAST_FP=$(printf '%s' "$BODY" | grep -oE 'Fingerprint: [0-9a-f]{40}' | awk '{print $2}')
          if [[ -z "$LAST_FP" ]]; then
            echo "::error::Latest release has no fingerprint in its body — a native release must land first (backfill the release body or run release-mobile workflow_dispatch)."
            exit 1
          fi
          if [[ "$LAST_FP" != "${{ steps.fingerprint.outputs.fingerprint }}" ]]; then
            echo "::error::Fingerprint changed (${LAST_FP} → ${{ steps.fingerprint.outputs.fingerprint }}) without a version bump."
            echo "::error::A native change (app.json, plugins, native deps) needs a new APK: bump package.json."
            exit 1
          fi
      - name: Publish JS bundle to EAS Update
        if: steps.skip.outputs.skip != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'workflow_dispatch' }}
        run: |
          npx eas-cli@latest update \
            --channel production \
            --platform android \
            --message "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)" \
            --non-interactive
