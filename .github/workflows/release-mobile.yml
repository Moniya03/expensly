name: Release Mobile

on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:

concurrency:
  group: release-mobile
  cancel-in-progress: false

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check version change
        id: check
        run: |
          CURRENT_VERSION=$(jq -r '.version // empty' package.json)
          if [[ -z "${CURRENT_VERSION}" ]]; then
            echo "::error::No 'version' field found in package.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          PREV_VERSION=$(git show HEAD~1:package.json 2>/dev/null | jq -r '.version // empty' 2>/dev/null || echo "")
          if [[ "${CURRENT_VERSION}" != "${PREV_VERSION}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync app version from package.json
        run: |
          VERSION=$(jq -r '.version' package.json)
          VERSION_CODE=$((10#$(echo "$VERSION" | tr -d '.')))
          jq --arg v "$VERSION" --argjson vc "$VERSION_CODE" \
            '.expo.version=$v | .expo.android.versionCode=$vc' \
            app.json > /tmp/app.json && mv /tmp/app.json app.json
          echo "app.json version=${VERSION} versionCode=${VERSION_CODE}"
      - name: Compute runtime fingerprint
        id: fingerprint
        run: |
          FINGERPRINT=$(node_modules/.bin/fingerprint fingerprint:generate --platform android | jq -r .hash)
          echo "fingerprint=${FINGERPRINT}" >> "$GITHUB_OUTPUT"
      - name: Write .env from secrets
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\nEXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=%s\n' \
            "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" \
            "${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" \
            > .env
      - name: Expo Prebuild
        run: bunx expo prebuild --platform android
      - name: Configure release signing
        run: |
          if [[ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              "${{ secrets.ANDROID_KEY_ALIAS }}" \
              "${{ secrets.ANDROID_KEY_PASSWORD }}" \
              > android/keystore.properties
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 not set — refusing to ship a debug-signed release. Run scripts/set-github-secrets.sh first."
            exit 1
          fi
          node scripts/patch-build-gradle.js
          node scripts/preflight-signing.js
      - name: Tune gradle memory (CI runner)
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          grep '^org.gradle.jvmargs' android/gradle.properties
      - name: Build release APKs
        run: bun run apk:release
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            android/app/build/outputs/apk/release/app-x86_64-release.apk
            android/app/build/outputs/apk/release/app-universal-release.apk

  release:
    needs: [detect-version, build]
    if: needs.detect-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.detect-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: release-files
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            Fingerprint: ${{ needs.build.outputs.fingerprint }}

            APK variants (sideload):
            - arm64-v8a: `release-files/app-arm64-v8a-release.apk`
            - armeabi-v7a: `release-files/app-armeabi-v7a-release.apk`
            - x86_64: `release-files/app-x86_64-release.apk`
            - universal: `release-files/app-universal-release.apk`
          files: |
            release-files/app-arm64-v8a-release.apk
            release-files/app-armeabi-v7a-release.apk
            release-files/app-x86_64-release.apk
            release-files/app-universal-release.apk
          generate_release_notes: true
